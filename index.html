<!DOCTYPE html>

<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio | หน้าปก</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .cover {

            position: relative;

            overflow: hidden;

            text-align: center;

        }

        /* ของตกแต่งรอบ ๆ */

        .deco {

            position: absolute;

            z-index: 1;

            font-size: 24px;

            pointer-events: none;

        }

        .star1 {

            top: 45px;

            left: 80px;

            color: #55a9d5;

        }

        .star2 {

            top: 110px;

            right: 75px;

            color: #e76b9b;

            font-size: 20px;

        }

        .heart1 {

            top: 190px;

            left: 55px;

            color: #e76b9b;

        }

        .heart2 {

            bottom: 105px;

            right: 70px;

            color: #72bde8;

            font-size: 22px;

        }

        .dot1 {

            width: 14px;

            height: 14px;

            border-radius: 50%;

            background: #b9e4ff;

            top: 80px;

            right: 130px;

        }

        .dot2 {

            width: 11px;

            height: 11px;

            border-radius: 50%;

            background: #ffc5dc;

            bottom: 85px;

            left: 110px;

        }

        /* หัวข้อ */

        .cover-decoration {

            position: relative;

            z-index: 2;

            color: #e76b9b;

            font-size: 25px;

            letter-spacing: 10px;

            margin-bottom: 8px;

        }

        .small-title {

            position: relative;

            z-index: 2;

            color: #4c91b8;

            font-size: 14px;

            font-weight: bold;

            letter-spacing: 4px;

            margin-bottom: 5px;

        }

        .cover h1 {

            position: relative;

            z-index: 2;

            color: #164f70;

            font-size: 40px;

            margin: 8px 0;

        }

        .line {

            position: relative;

            z-index: 2;

            width: 110px;

            height: 4px;

            border-radius: 10px;

            margin: 12px auto 22px;

            background: linear-gradient(to right, #72bde8, #e76b9b);

        }

        /* กรอบรูป */

        .cover-photo {

            position: relative;

            z-index: 2;

            width: 145px;

            height: 175px;

            margin: 10px auto 18px;

            padding: 7px;

            background: white;

            border: 3px solid #8dcef0;

            border-radius: 25px;

            box-shadow: 0 8px 20px rgba(70, 130, 165, 0.2);

            transform: rotate(-2deg);

            transition: 0.4s;

        }

        .cover-photo::before {

            content: "✦";

            position: absolute;

            top: -18px;

            right: -17px;

            color: #e76b9b;

            font-size: 25px;

        }

        .cover-photo::after {

            content: "♡";

            position: absolute;

            bottom: -20px;

            left: -18px;

            color: #72bde8;

            font-size: 27px;

        }

        .cover-photo:hover {

            transform: rotate(0deg) scale(1.04);

        }

        .cover-photo img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            border-radius: 18px;

        }

        .cover h2 {

            position: relative;

            z-index: 2;

            color: #d34f83;

            font-size: 23px;

            margin: 15px 0 8px;

        }

        .welcome {

            position: relative;

            z-index: 2;

            color: #496b7d;

            font-size: 16px;

            margin-bottom: 18px;

        }

        /* กล่องเล็กด้านล่าง */

        .mini-box {

            position: relative;

            z-index: 2;

            display: inline-block;

            padding: 9px 20px;

            border: 2px solid #b9dff2;

            border-radius: 20px;

            background: #f5fbff;

            color: #4d7890;

            font-size: 13px;

            box-shadow: 0 4px 12px rgba(70, 130, 165, 0.1);

        }

        .bottom {

            position: relative;

            z-index: 2;

            margin-top: 20px;

        }

        @media (max-width: 600px) {

            .cover h1 {

                font-size: 32px;

            }

            .cover-photo {

                width: 125px;

                height: 155px;

            }

            .star1 {

                left: 25px;

            }

            .star2 {

                right: 25px;

            }

            .heart1 {

                left: 20px;

            }

            .heart2 {

                right: 25px;

            }

        }

    </style>

</head>

<body>

<nav class="navbar">

    <a href="index.html">หน้าแรก</a>

    <a href="profile.html">ประวัติส่วนตัว</a>

    <a href="education.html">การศึกษาต่อ</a>

    <a href="activity.html">กิจกรรมและผลงาน</a>

    <a href="contact.html">ติดต่อ</a>

</nav>

<main class="cover">

    <!-- ของตกแต่ง -->

    <span class="deco star1">✦</span>

    <span class="deco star2">✧</span>

    <span class="deco heart1">♡</span>

    <span class="deco heart2">♡</span>

    <span class="deco dot1"></span>

    <span class="deco dot2"></span>

    <div class="cover-decoration">✦ ♡ ✦</div>

    <p class="small-title">MY PORTFOLIO</p>

    <h1>แฟ้มสะสมงาน</h1>

    <div class="line"></div>

    <div class="cover-photo">

        <img src="IMG_5813.jpeg" alt="รูปของฉัน">

    </div>

    <h2>Portfolio</h2>

    <p class="welcome">

        ยินดีต้อนรับเข้าสู่แฟ้มสะสมงานของฉัน 

    </p>

    <div class="mini-box">

        ✧ My journey • My activities • My dreams ✧

    </div>

    <div class="cover-decoration bottom">♡ ✦ ♡</div>

</main>

</body>

</html>
