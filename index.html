<!DOCTYPE html>

<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>หน้าแรก | Portfolio</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .cover {

            position: relative;

            overflow: hidden;

            text-align: center;

            padding: 45px 20px 30px;

        }

        /* ของตกแต่ง */

        .deco {

            position: absolute;

            font-size: 22px;

            z-index: 1;

            opacity: 0.85;

        }

        .deco1 {

            top: 25px;

            left: 8%;

            color: #72bde8;

        }

        .deco2 {

            top: 55px;

            right: 10%;

            color: #f39bbb;

        }

        .deco3 {

            top: 160px;

            left: 5%;

            color: #f39bbb;

        }

        .deco4 {

            top: 190px;

            right: 6%;

            color: #72bde8;

        }

        .deco5 {

            bottom: 80px;

            left: 12%;

            color: #72bde8;

        }

        .deco6 {

            bottom: 95px;

            right: 12%;

            color: #f39bbb;

        }

        .cover h4 {

            color: #72aeda;

            letter-spacing: 4px;

            margin-bottom: 8px;

            font-size: 15px;

        }

        .cover h1 {

            color: #4d9bd0;

            font-size: 36px;

            margin: 5px 0;

        }

        .cover h2 {

            color: #e889ae;

            font-size: 24px;

            margin-top: 8px;

        }

        .cover-photo {

            width: 145px;

            height: 175px;

            object-fit: cover;

            border-radius: 25px;

            margin: 20px auto 12px;

            display: block;

            border: 5px solid white;

            box-shadow: 0 5px 18px rgba(100, 160, 200, 0.25);

        }

        .welcome {

            color: #666;

            font-size: 16px;

            line-height: 1.8;

            margin: 10px auto;

            max-width: 500px;

        }

        .mini-box {

            display: inline-block;

            margin-top: 12px;

            padding: 10px 18px;

            border-radius: 20px;

            background: #eef8ff;

            color: #629fc8;

            font-size: 14px;

        }

        .extra-decoration {

            position: relative;

            z-index: 2;

            margin-top: 18px;

            color: #72bde8;

            font-size: 18px;

            letter-spacing: 5px;

            opacity: 0.9;

        }

        /* ปุ่มไปหน้าถัดไป */

        .next-button {

            display: inline-block;

            margin-top: 22px;

            padding: 11px 25px;

            background: linear-gradient(135deg, #8bc9ee, #f2a8c5);

            color: white;

            text-decoration: none;

            border-radius: 25px;

            font-weight: bold;

            box-shadow: 0 5px 12px rgba(100, 160, 200, 0.2);

            transition: 0.3s;

        }

        .next-button:hover {

            transform: translateY(-3px);

            box-shadow: 0 8px 16px rgba(100, 160, 200, 0.3);

        }

        @media (max-width: 600px) {

            .cover {

                padding: 35px 15px 25px;

            }

            .cover h1 {

                font-size: 30px;

            }

            .cover h2 {

                font-size: 21px;

            }

            .cover-photo {

                width: 125px;

                height: 155px;

            }

            .deco {

                font-size: 18px;

            }

        }

    </style>

</head>

<body>
<nav class="navbar">

    <a href="index.html">หน้าแรก</a>

    <a href="preface.html">คำนำ</a>

    <a href="profile.html">ประวัติส่วนตัว</a>

    <a href="education.html">การศึกษาต่อ</a>

    <a href="activity.html">กิจกรรมและผลงาน</a>

    <a href="contact.html">ติดต่อ</a>

</nav>
    <main class="container">

        <div class="cover">

            <!-- ของตกแต่ง -->

            <div class="deco deco1">✦</div>

            <div class="deco deco2">♡</div>

            <div class="deco deco3">✧</div>

            <div class="deco deco4">♡</div>

            <div class="deco deco5">✦</div>

            <div class="deco deco6">✧</div>

            <h4>MY PORTFOLIO</h4>

            <h1>แฟ้มสะสมงาน</h1>

            <img src="IMG_5813.jpeg" alt="รูปของฉัน" class="cover-photo">

            <h2>Portfolio</h2>

            <p class="welcome">

                ยินดีต้อนรับเข้าสู่แฟ้มสะสมผลงานของฉันนะคะ <br>

                เว็บไซต์นี้รวบรวมประวัติ การศึกษา กิจกรรม

                และผลงานต่าง ๆ ของฉัน

            </p>

            <div class="mini-box">

                ✧ My journey • My activities • My dreams ✧

            </div>

            <div class="extra-decoration">

                ✦　♡　✧　♡　✦

            </div>

            <!-- ปุ่มไปหน้าถัดไป -->

            <a href="profile.html" class="next-button">

                 ไปหน้าถัดไป →

            </a>

        </div>

    </main>

</body>

</html>
