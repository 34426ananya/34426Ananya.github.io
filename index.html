<!DOCTYPE html>

<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio | หน้าปก</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* ตกแต่งเฉพาะหน้าปก */

        .cover {

            position: relative;

            overflow: hidden;

        }

        .cover::before {

            content: "✦";

            position: absolute;

            top: 35px;

            left: 45px;

            font-size: 28px;

            color: #72bde8;

            animation: float 3s ease-in-out infinite;

        }

        .cover::after {

            content: "♡";

            position: absolute;

            bottom: 35px;

            right: 45px;

            font-size: 32px;

            color: #e76b9b;

            animation: float 3s ease-in-out infinite;

        }

        .cover-decoration {

            color: #e76b9b;

            font-size: 25px;

            letter-spacing: 10px;

            margin-bottom: 10px;

        }

        .small-title {

            color: #4c91b8;

            font-size: 14px;

            font-weight: bold;

            letter-spacing: 4px;

            margin-bottom: 5px;

        }

        .cover h1 {

            color: #164f70;

            font-size: 40px;

            margin: 8px 0;

        }

        .line {

            width: 100px;

            height: 4px;

            border-radius: 10px;

            margin: 12px auto 20px;

            background: linear-gradient(to right, #72bde8, #e76b9b);

        }

        .cover-photo {

            width: 145px;

            height: 175px;

            margin: 15px auto;

            padding: 7px;

            background: white;

            border: 3px solid #8dcef0;

            border-radius: 25px;

            box-shadow: 0 8px 20px rgba(70, 130, 165, 0.2);

            transform: rotate(-2deg);

            transition: 0.4s;

        }

        .cover-photo:hover {

            transform: rotate(0deg) scale(1.04);

        }

        .cover-photo img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            border-radius: 18px;

        }

        .cover h2 {

            color: #d34f83;

            font-size: 23px;

            margin: 18px 0 8px;

        }

        .welcome {

            color: #496b7d;

            font-size: 16px;

        }

        .bottom {

            margin-top: 20px;

            margin-bottom: 0;

        }

        @keyframes float {

            0%, 100% {

                transform: translateY(0);

            }

            50% {

                transform: translateY(-7px);

            }

        }

        @media (max-width: 600px) {

            .cover h1 {

                font-size: 32px;

            }

            .cover-photo {

                width: 125px;

                height: 155px;

            }

        }

    </style>

</head>

<body>

<nav class="navbar">

    <a href="index.html">หน้าแรก</a>

    <a href="profile.html">ประวัติส่วนตัว</a>

    <a href="education.html">การศึกษาต่อ</a>

    <a href="activity.html">กิจกรรมและผลงาน</a>

    <a href="contact.html">ติดต่อ</a>

</nav>

<main class="cover">

    <div class="cover-decoration">✦ ♡ ✦</div>

    <p class="small-title">MY PORTFOLIO</p>

    <h1>แฟ้มสะสมผลงาน</h1>

    <div class="line"></div>

    <div class="cover-photo">

        <img src="IMG_5813.jpeg" alt="รูปของฉัน">

    </div>

    <h2>Portfolio</h2>

    <p class="welcome">

        ยินดีต้อนรับ

    </p>

    <div class="cover-decoration bottom">♡ ✦ ♡</div>

</main>

</body>

</html>
