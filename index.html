<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>หน้าแนะนำตัวของฉัน</title>

<link href="https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body {
    background: linear-gradient(135deg, #bdefff, #dff7ff);
    color: #555;
    text-align: center;
    padding: 50px 20px;
    font-family: 'Mali', sans-serif;
    min-height: 100vh;
}

.card {
    background: #fff5fa;
    border: 5px solid #ffb6d5;
    border-radius: 35px;
    box-shadow: 0 8px 20px rgba(255, 150, 190, 0.3);
    max-width: 500px;
    margin: 0 auto;
    padding: 35px;

}
h1 { color: #2c3e50; }
p { font-size: 18px; line-height: 1.6; }
</style>
</head>
<body>
<div class="card">
<h1>ยินดีต้อนรับสู่โปรไฟล์ของฉัน </
</div>
</body>
</html>
