        .preface-card {

        .preface-title {

            margin-bottom: 25px;

        .preface-title span {

        }

        .preface-card p {

            color: #555;

            font-size: 16px;

            line-height: 2;

            text-indent: 2em;

            margin-bottom: 18px;

        }

        .decoration {

            text-align: center;

            color: #72bde8;

            font-size: 20px;

            letter-spacing: 6px;

            margin: 10px 0 25px;

        }

        .thank-you {

            text-align: center;

            background: #fff0f6;

            border-radius: 20px;

            padding: 15px;

            color: #d979a0;

            margin-top: 25px;

        }

        @media (max-width: 600px) {

            .preface-card {

                padding: 22px;

            }

            .preface-card p {

                font-size: 15px;

                line-height: 1.9;

            }

        }

    </style>
